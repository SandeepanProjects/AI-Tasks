services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_DB: compliance, POSTGRES_USER: app, POSTGRES_PASSWORD: app}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U app -d compliance"], interval: 5s, timeout: 3s, retries: 20}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
  api:
    build: .
    env_file: .env
    command: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: .
    env_file: .env
    command: ["celery","-A","app.workers.celery_app:celery","worker","--loglevel=INFO","--concurrency=2"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
volumes: {pgdata: {}, redisdata: {}}
