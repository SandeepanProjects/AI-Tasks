[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-compliance-review-platform"
version = "3.0.0"
description = "Asynchronous multi-agent financial compliance review reference platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1",
  "psycopg[binary,pool]>=3.2,<4", "alembic>=1.13,<2",
  "pgvector>=0.3,<1", "redis>=5,<6", "celery[redis]>=5.4,<6",
  "langgraph>=0.2.60,<1", "langgraph-checkpoint-postgres>=2.0,<3",
  "langchain-openai>=0.2.10,<1", "PyJWT[crypto]>=2.9,<3",
  "structlog>=24.4,<26", "tenacity>=9,<10"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1", "mypy>=1.13,<2"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
