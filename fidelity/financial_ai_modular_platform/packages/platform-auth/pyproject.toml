[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-auth"
version = "0.1.0"
description = "Authentication, authorization and tenant context."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
]


[tool.setuptools.packages.find]
where = ["src"]
