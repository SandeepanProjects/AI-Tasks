[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-guardrails"
version = "0.1.0"
description = "Reusable AI validation and safety primitives."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
]


[tool.setuptools.packages.find]
where = ["src"]
