[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-messaging"
version = "0.1.0"
description = "Celery and event infrastructure."
requires-python = ">=3.12"
dependencies = [
    "celery",
    "redis",
]


[tool.setuptools.packages.find]
where = ["src"]
