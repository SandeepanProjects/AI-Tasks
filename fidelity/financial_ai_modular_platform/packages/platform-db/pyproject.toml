[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-db"
version = "0.1.0"
description = "Generic async SQLAlchemy infrastructure."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy",
    "platform-core",
]


[tool.setuptools.packages.find]
where = ["src"]
