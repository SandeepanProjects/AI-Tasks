[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agents"
version = "0.1.0"
description = "Reusable agent runtime and orchestration contracts."
requires-python = ">=3.12"
dependencies = [
    "ai-llm",
    "ai-rag",
    "platform-core",
]


[tool.setuptools.packages.find]
where = ["src"]
