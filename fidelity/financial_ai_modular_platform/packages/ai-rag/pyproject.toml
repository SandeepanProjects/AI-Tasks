[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rag"
version = "0.1.0"
description = "Document, chunk, embedding and retrieval contracts."
requires-python = ">=3.12"
dependencies = [
    "platform-core",
]


[tool.setuptools.packages.find]
where = ["src"]
