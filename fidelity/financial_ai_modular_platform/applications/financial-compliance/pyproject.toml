[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-compliance"
version = "0.1.0"
description = "Financial compliance review application."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "platform-core",
    "platform-auth",
    "platform-observability",
    "ai-llm",
    "ai-rag",
    "ai-agents",
    "ai-guardrails",
]


[tool.setuptools.packages.find]
where = ["src"]
