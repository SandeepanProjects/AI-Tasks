services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: compliance}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d compliance"], interval: 5s, timeout: 5s, retries: 20}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
volumes: {pgdata:}
