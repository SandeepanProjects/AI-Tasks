services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: compliance}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U app -d compliance"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
