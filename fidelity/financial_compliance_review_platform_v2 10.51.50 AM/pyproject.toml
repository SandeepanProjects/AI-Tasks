[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="financial-compliance-platform"
version="2.0.0"
requires-python=">=3.11"
dependencies=[
"fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3","pydantic-settings>=2.4,<3",
"sqlalchemy[asyncio]>=2.0.32,<3","asyncpg>=0.29,<1","psycopg[binary]>=3.2,<4",
"pgvector>=0.3,<1","alembic>=1.13,<2","redis>=5,<6","celery[redis]>=5.4,<6",
"langgraph>=0.2.50,<1","langchain-core>=0.3,<1","httpx>=0.27,<1","PyJWT[crypto]>=2.9,<3",
"opentelemetry-api>=1.27,<2","opentelemetry-sdk>=1.27,<2",
"opentelemetry-exporter-otlp-proto-grpc>=1.27,<2","structlog>=24.4,<26","tenacity>=9,<10"
]
[project.optional-dependencies]
dev=["pytest>=8,<9","pytest-asyncio>=0.24,<2","ruff>=0.6,<1"]
[tool.setuptools.packages.find]
where=["."]
include=["app*"]
[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]
