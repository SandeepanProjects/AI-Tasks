apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: enterprise-ai
spec:
  replicas: 2
  selector:
    matchLabels: {app: ai-worker}
  template:
    metadata:
      labels: {app: ai-worker}
    spec:
      containers:
        - name: worker
          image: enterprise-ai-copilot:latest
          command: ["celery","-A","app.workers.celery_app.celery_app","worker","--loglevel=INFO","--concurrency=2"]
