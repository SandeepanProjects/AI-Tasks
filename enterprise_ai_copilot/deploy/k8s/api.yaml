apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-api
  namespace: enterprise-ai
spec:
  replicas: 3
  selector:
    matchLabels: {app: ai-api}
  template:
    metadata:
      labels: {app: ai-api}
    spec:
      containers:
        - name: api
          image: enterprise-ai-copilot:latest
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-api
  namespace: enterprise-ai
spec:
  selector: {app: ai-api}
  ports:
    - port: 80
      targetPort: 8000
