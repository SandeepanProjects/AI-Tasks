services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: langgraph
    ports:
      - "5432:5432"
    volumes:
      - langgraph_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph -d langgraph"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  langgraph_pgdata:
